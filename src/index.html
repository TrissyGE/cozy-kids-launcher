<!doctype html>
<html lang="{{ACTIVE_LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="/frontend/design-system.css">
<link rel="stylesheet" href="/frontend/styles.css">
</head>
<body class="theme-{{DEFAULT_THEME}}">
<div id="themeBg"></div>
<div id="clockBadge"></div>
<div id="batteryBadge"></div>
<div id="timerBadge"></div>
<button id="navLeft" class="nav left hidden" data-local-icon="nav-left" data-icon-only aria-label="{{ADMIN_PAGE_PREV}}" onclick="changePage(-1)"></button>
<button id="navRight" class="nav right hidden" data-local-icon="nav-right" data-icon-only aria-label="{{ADMIN_PAGE_NEXT}}" onclick="changePage(1)"></button>
<div id="kids" class="screen">
  <div class="wrap">
    <div class="titlewrap"><h1 id="title"></h1></div>
    <div id="grid" class="grid {{DEFAULT_LAYOUT}}">
      <section id="startupState" class="ui-state ui-state-loading launcher-state" role="status" aria-live="polite" aria-busy="true">
        <span class="ui-state-message">{{STARTUP_LOADING}}</span>
      </section>
    </div>
  </div>
</div>
<div id="pin" class="pinoverlay hidden">
  <div class="pinbox">
    <h2 id="pinTitle">{{PIN_TITLE}}</h2>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="{{PIN_PLACEHOLDER}}" onkeydown="if(event.key==='Enter')submitPin()">
    <div class="err" id="pinErr"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:8px;">
      <button id="pinCancelBtn" class="smallbtn" data-local-icon="back" onclick="cancelPin()">{{LABEL_BACK}}</button>
      <button class="smallbtn save" data-local-icon="lock" onclick="submitPin()">OK</button>
    </div>
    <div class="hint" id="pinHint"></div>
  </div>
</div>
<div id="confirmOverlay" class="install-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
  <div class="confirm-box">
    <h2 id="confirmTitle"></h2>
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" type="button" class="smallbtn" onclick="resolveConfirmation(false)"></button>
      <button id="confirmActionBtn" type="button" class="smallbtn save" onclick="resolveConfirmation(true)"></button>
    </div>
  </div>
</div>
<div id="profileOverlay" class="install-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="profilePickerTitle" aria-describedby="profilePickerHint">
  <div class="profile-picker">
    <div class="profile-picker-header">
      <div>
        <h2 id="profilePickerTitle"></h2>
        <p id="profilePickerHint" class="muted"></p>
      </div>
      <button id="profilePickerClose" type="button" class="smallbtn" onclick="closeProfilePicker()"></button>
    </div>
    <div id="profilePickerGrid" class="profile-picker-grid"></div>
    <div id="profilePickerMessage" class="ui-state" aria-live="polite" hidden></div>
  </div>
</div>
<div id="firstRunOverlay" class="install-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="firstRunTitle" aria-describedby="firstRunDescription">
  <div class="first-run-box">
    <div class="first-run-progress-row">
      <span id="firstRunProgress"></span>
      <div id="firstRunProgressDots" class="first-run-progress-dots" aria-hidden="true"></div>
    </div>
    <h2 id="firstRunTitle"></h2>
    <p id="firstRunDescription" class="muted"></p>
    <div id="firstRunContent" class="first-run-content"></div>
    <div id="firstRunMessage" class="ui-state" aria-live="polite" hidden></div>
    <div class="first-run-actions">
      <button id="firstRunSkipBtn" type="button" class="smallbtn" onclick="skipFirstRun()"></button>
      <span class="first-run-action-spacer"></span>
      <button id="firstRunBackBtn" type="button" class="smallbtn" onclick="changeFirstRunStep(-1)"></button>
      <button id="firstRunNextBtn" type="button" class="smallbtn save" onclick="changeFirstRunStep(1)"></button>
    </div>
  </div>
</div>
<div id="updating" class="pinoverlay hidden">
  <div class="pinbox">
    <div class="emoji" data-local-icon="update" data-icon-only aria-label="{{UPDATE_PROGRESS}}" style="font-size:3rem;"></div>
    <h2 id="updateProgressTitle">{{UPDATE_PROGRESS}}</h2>
    <div class="muted" id="updateProgressText"></div>
  </div>
</div>
<div id="installOverlay" class="install-overlay hidden">
  <div class="install-box">
    <h2 id="installTitle"></h2>
    <div id="installMessage"></div>
    <div class="command-box">
      <span id="installCommand"></span>
      <button id="installCopyBtn" class="smallbtn" data-local-icon="copy" onclick="copyInstallCommand()">{{LABEL_COPY_COMMAND}}</button>
    </div>
    <div id="installHint" class="muted" style="margin-top:12px;"></div>
    <button id="installCloseBtn" class="smallbtn" data-local-icon="close" onclick="closeInstallOverlay()">{{LABEL_CLOSE}}</button>
  </div>
</div>
<div id="themeOverlay" class="install-overlay hidden">
  <div class="install-box" style="max-width:900px;">
    <h2 id="themePickerTitle">Theme</h2>
    <div id="themeChooser" class="theme-grid" style="max-height:60vh; overflow-y:auto; padding:8px;"></div>
    <button id="themePickerCloseBtn" class="smallbtn" data-local-icon="close" onclick="closeThemePicker()" style="margin-top:12px;">{{LABEL_CLOSE}}</button>
  </div>
</div>
<div id="timerWarning" class="timeroverlay hidden">
  <div class="timerbox">
    <div class="emoji" data-local-icon="timer" data-icon-only aria-label="{{TIMER_WARNING_TITLE}}"></div>
    <h2 id="timerWarningTitle"></h2>
    <div class="muted" id="timerWarningText"></div>
  </div>
</div>
<div id="timerBlock" class="timeroverlay hidden">
  <div class="timerbox">
    <div class="emoji" data-local-icon="timer" data-icon-only aria-label="{{TIMER_EXPIRED_TITLE}}"></div>
    <h2 id="timerBlockTitle">{{TIMER_EXPIRED_TITLE}}</h2>
    <p id="timerBlockBody">{{TIMER_EXPIRED_BODY}}</p>
    <input id="timerBlockPin" type="password" inputmode="numeric" maxlength="6" placeholder="{{PIN_PLACEHOLDER}}" onkeydown="if(event.key==='Enter')extendFromBlock()">
    <div class="err" id="timerBlockErr"></div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px;">
      <button class="smallbtn" onclick="extendFromBlock(15)">+15</button>
      <button class="smallbtn" onclick="extendFromBlock(30)">+30</button>
      <button class="smallbtn" onclick="extendFromBlock(60)">+60</button>
    </div>
    <div style="margin-top:12px;">
      <button id="timerBlockExitBtn" class="smallbtn" onclick="exitKids()">{{TIMER_EXIT}}</button>
    </div>
  </div>
</div>
<div id="startOverlay" class="startoverlay hidden">
  <div class="startbox">
    <div class="emoji" id="startEmoji">✨</div>
    <h2 id="startText">{{STARTING_APP}}</h2>
  </div>
</div>
<div id="admin" class="screen hidden">
  <div class="wrap admin">
    <div class="panel admin-shell">
      <header class="admin-header">
        <h2 id="adminTitle">{{ADMIN_TITLE}}</h2>
        <div class="admin-header-actions">
          <button id="backBtn" class="smallbtn" onclick="closeAdmin()">{{LABEL_BACK}}</button>
          <button id="saveBtn" class="smallbtn save" onclick="saveConfig()">{{LABEL_SAVE}}</button>
        </div>
      </header>
      <div id="saveMsg" class="ui-state" aria-live="polite" hidden></div>
      <div class="admin-workspace">
        <nav id="adminNav" class="admin-nav" onkeydown="handleAdminNavKey(event)">
          <button id="adminNavOverview" class="admin-tab" type="button" data-admin-section="overview" aria-controls="adminSectionOverview" onclick="activateAdminSection('overview')"></button>
          <button id="adminNavChildren" class="admin-tab" type="button" data-admin-section="children" aria-controls="adminSectionChildren" onclick="activateAdminSection('children')"></button>
          <button id="adminNavApps" class="admin-tab" type="button" data-admin-section="apps" aria-controls="adminSectionApps" onclick="activateAdminSection('apps')"></button>
          <button id="adminNavScreenTime" class="admin-tab" type="button" data-admin-section="screen-time" aria-controls="adminSectionScreenTime" onclick="activateAdminSection('screen-time')"></button>
          <button id="adminNavAppearance" class="admin-tab" type="button" data-admin-section="appearance" aria-controls="adminSectionAppearance" onclick="activateAdminSection('appearance')"></button>
          <button id="adminNavSystem" class="admin-tab" type="button" data-admin-section="system" aria-controls="adminSectionSystem" onclick="activateAdminSection('system')"></button>
        </nav>
        <main class="admin-content">
          <section id="adminSectionOverview" class="admin-section" data-admin-panel="overview" aria-labelledby="adminNavOverview">
            <h3 class="section-heading" tabindex="-1"></h3>
            <div class="overview-grid">
              <button class="overview-card" type="button" onclick="activateAdminSection('apps',true)">
                <span id="overviewAppsLabel" class="overview-label"></span>
                <span id="overviewAppsValue" class="overview-value"></span>
              </button>
              <button class="overview-card" type="button" onclick="activateAdminSection('screen-time',true)">
                <span id="overviewTimerLabel" class="overview-label"></span>
                <span id="overviewTimerValue" class="overview-value"></span>
              </button>
              <button class="overview-card" type="button" onclick="activateAdminSection('appearance',true)">
                <span id="overviewAppearanceLabel" class="overview-label"></span>
                <span id="overviewAppearanceValue" class="overview-value"></span>
              </button>
            </div>
          </section>

          <section id="adminSectionChildren" class="admin-section" data-admin-panel="children" aria-labelledby="adminNavChildren" hidden>
            <h3 class="section-heading" tabindex="-1"></h3>
            <p id="profileManageHint" class="muted"></p>
            <div class="profile-management-grid">
              <section class="profile-list-panel" aria-labelledby="profileListTitle">
                <h4 id="profileListTitle"></h4>
                <div id="profileList" class="profile-list"></div>
              </section>
              <section class="profile-editor" aria-labelledby="profileEditorTitle">
                <h4 id="profileEditorTitle"></h4>
                <label class="admin-field-label" for="cfgProfileName"><span id="profileNameLabel"></span>
                  <input id="cfgProfileName" maxlength="40">
                </label>
                <label class="admin-field-label" for="cfgProfileAvatar"><span id="profileAvatarLabel"></span>
                  <input id="cfgProfileAvatar" maxlength="16">
                </label>
                <label class="admin-field-label" for="cfgTitle"><span id="profileLauncherTitleLabel"></span>
                  <input id="cfgTitle" placeholder="{{PLACEHOLDER_TITLE}}" oninput="renderAppearancePreview()">
                </label>
              </section>
            </div>
            <section class="profile-create" aria-labelledby="profileCreateTitle">
              <h4 id="profileCreateTitle"></h4>
              <div class="row2">
                <input id="newProfileName" maxlength="40">
                <input id="newProfileAvatar" maxlength="16">
                <button id="createProfileBtn" type="button" class="smallbtn" onclick="createProfileFromAdmin()"></button>
              </div>
              <div id="profileAdminMessage" class="ui-state" aria-live="polite" hidden></div>
            </section>
            <div class="row2 profile-global-settings">
              <input id="cfgParentLabel" placeholder="{{PLACEHOLDER_PARENT_LABEL}}">
              <input id="cfgExitLabel" placeholder="{{PLACEHOLDER_EXIT_LABEL}}">
            </div>
          </section>

          <section id="adminSectionApps" class="admin-section" data-admin-panel="apps" aria-labelledby="adminNavApps" hidden>
            <h3 class="section-heading" tabindex="-1"></h3>
            <div class="app-list-tools">
              <label class="admin-field-label" for="tileSearch"><span id="tileSearchLabel"></span>
                <input id="tileSearch" type="search" oninput="setAdminTileSearch(this.value)">
              </label>
              <label class="admin-field-label" for="tileVisibilityFilter"><span id="tileFilterLabel"></span>
                <select id="tileVisibilityFilter" onchange="setAdminTileVisibility(this.value)">
                  <option id="tileFilterAll" value="all"></option>
                  <option id="tileFilterVisible" value="visible"></option>
                  <option id="tileFilterHidden" value="hidden"></option>
                </select>
              </label>
              <button id="addTileBtn" class="smallbtn" onclick="addTile()">{{LABEL_ADD_TILE}}</button>
            </div>
            <div id="adminTileResultCount" class="muted admin-result-count" aria-live="polite"></div>
            <div id="adminBulkToolbar" class="admin-bulk-toolbar" role="toolbar">
              <label class="bulk-select-all" for="bulkSelectFiltered">
                <input id="bulkSelectFiltered" type="checkbox" onchange="toggleFilteredTileSelection(this.checked)">
                <span id="bulkSelectFilteredLabel"></span>
              </label>
              <span id="bulkSelectionCount" class="muted" aria-live="polite"></span>
              <div class="admin-bulk-actions">
                <button id="bulkShowTilesBtn" type="button" class="smallbtn" onclick="setSelectedTilesVisible(true)"></button>
                <button id="bulkHideTilesBtn" type="button" class="smallbtn" onclick="setSelectedTilesVisible(false)"></button>
                <button id="bulkDeleteTilesBtn" type="button" class="smallbtn" onclick="deleteSelectedTiles()"></button>
              </div>
            </div>
            <div class="row2" style="grid-template-columns:1fr 1fr; margin-top:8px; align-items:center;">
              <label style="font-weight:700; color:var(--text);">Browser</label>
              <select id="cfgBrowser"></select>
            </div>
            <div id="browserHint" class="muted" style="margin-bottom:8px;"></div>
            <div id="browserCatalogState" class="ui-state" aria-live="polite" hidden></div>
            <div id="appCatalogState" class="ui-state" aria-live="polite" hidden></div>
            <div id="forms"></div>
            <div id="adminTileEmptyState" class="admin-empty-state" role="status" hidden></div>
            <div class="adminpagenav" id="adminPageNav"></div>
            <div id="recommendations" style="margin-top:18px;"></div>
          </section>

          <section id="adminSectionScreenTime" class="admin-section" data-admin-panel="screen-time" aria-labelledby="adminNavScreenTime" hidden>
            <h3 class="section-heading" tabindex="-1"></h3>
            <div class="row2" style="grid-template-columns:1fr 1fr 1fr 1fr; margin-top:8px; align-items:center;">
              <label style="font-weight:700; color:var(--text);"><span id="timerLabel"></span></label>
              <select id="cfgTimerMinutes">
                <option id="timerOptionOff" value="0">{{TIMER_OFF}}</option>
                <option id="timerOption15" value="15">15 {{TIMER_MINUTES}}</option>
                <option id="timerOption30" value="30">30 {{TIMER_MINUTES}}</option>
                <option id="timerOption60" value="60">60 {{TIMER_MINUTES}}</option>
                <option id="timerOptionCustom" value="custom">{{TIMER_CUSTOM}}</option>
              </select>
              <input id="cfgTimerCustom" type="number" min="1" max="180" placeholder="Minuten" style="display:none;">
              <button class="smallbtn" id="timerToggleBtn" onclick="toggleTimer()">{{TIMER_START}}</button>
            </div>
            <div id="timerStatus" class="muted"></div>
          </section>

          <section id="adminSectionAppearance" class="admin-section" data-admin-panel="appearance" aria-labelledby="adminNavAppearance" hidden>
            <h3 class="section-heading" tabindex="-1"></h3>
            <input type="hidden" id="cfgTheme">
            <div class="appearance-settings-grid">
              <div class="appearance-controls">
                <div class="row2">
                  <button id="openThemeBtn" class="smallbtn" onclick="openThemePicker()"><span id="themeDisplay"></span></button>
                  <select id="cfgLayoutMode" onchange="renderAppearancePreview()"><option id="layoutOptionLarge" value="gross">{{LABEL_LAYOUT_LARGE}}</option><option id="layoutOptionSmall" value="klein">{{LABEL_LAYOUT_SMALL}}</option></select>
                </div>
                <div id="customThemePanel" class="row2" style="display:none; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); margin-top:8px;">
                  <label style="display:flex;align-items:center;gap:6px;font-weight:700;">BG1 <input type="color" id="cfgCustomBg1" style="width:50px;padding:0;border:0;" oninput="renderAppearancePreview()"></label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:700;">BG2 <input type="color" id="cfgCustomBg2" style="width:50px;padding:0;border:0;" oninput="renderAppearancePreview()"></label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:700;">Text <input type="color" id="cfgCustomText" style="width:50px;padding:0;border:0;" oninput="renderAppearancePreview()"></label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:700;">Btn <input type="color" id="cfgCustomBtn" style="width:50px;padding:0;border:0;" oninput="renderAppearancePreview()"></label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:700;">Card <input type="color" id="cfgCustomCard" style="width:50px;padding:0;border:0;" oninput="renderAppearancePreview()"></label>
                  <input id="cfgCustomBg" placeholder="Hintergrundbild Pfad (optional)">
                </div>
              </div>
              <section class="appearance-preview-shell" aria-labelledby="appearancePreviewHeading">
                <h4 id="appearancePreviewHeading">{{LABEL_PREVIEW_TITLE}}</h4>
                <div id="appearancePreview" class="launcher-preview" role="img">
                  <div id="appearancePreviewTitle" class="preview-launcher-title"></div>
                  <div id="appearancePreviewGrid" class="preview-launcher-grid"></div>
                </div>
              </section>
            </div>
          </section>

          <section id="adminSectionSystem" class="admin-section" data-admin-panel="system" aria-labelledby="adminNavSystem" hidden>
            <h3 class="section-heading" tabindex="-1"></h3>
            <div class="row2" style="grid-template-columns:1fr 1fr 1fr 1fr; margin-top:8px;">
              <input id="cfgPin" type="password" inputmode="numeric" maxlength="6" placeholder="{{PIN_SET}}">
              <input id="cfgPinConfirm" type="password" inputmode="numeric" maxlength="6" placeholder="{{PIN_CONFIRM}}">
              <button class="smallbtn" id="setPinBtn" data-local-icon="lock" onclick="savePin()">{{PIN_SET}}</button>
              <button class="smallbtn" id="removePinBtn" onclick="removePin()">{{PIN_REMOVE}}</button>
            </div>
            <div id="pinMsg" class="muted"></div>
            <div class="row2" style="grid-template-columns:1fr 1fr; margin-top:8px; align-items:center;">
              <span class="muted" id="versionDisplay"></span>
              <button class="smallbtn" id="checkUpdateBtn" onclick="checkUpdate()">{{UPDATE_CHECK}}</button>
            </div>
            <div id="updateMsg" class="ui-state" aria-live="polite" hidden></div>
            <div class="row2" id="updateRow" style="grid-template-columns:1fr 1fr; margin-top:8px; display:none;">
              <span class="muted"></span>
              <button class="smallbtn save" id="updateNowBtn" data-local-icon="update" onclick="installUpdate()">{{UPDATE_NOW}}</button>
            </div>
            <div class="row2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-top:8px; align-items:center;">
              <button id="exportConfigBtn" class="smallbtn" data-local-icon="download" onclick="exportConfig()">{{LABEL_EXPORT_CONFIG}}</button>
              <button id="importConfigBtn" class="smallbtn" data-local-icon="upload" onclick="document.getElementById('importFile').click()">{{LABEL_IMPORT_CONFIG}}</button>
              <button id="exportDiagnosticsBtn" class="smallbtn" data-local-icon="diagnostics" onclick="exportDiagnostics()">{{LABEL_EXPORT_DIAGNOSTICS}}</button>
              <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importConfig(this)">
            </div>
            <div id="importMsg" class="muted"></div>
            <section class="backup-panel" aria-labelledby="backupTitle">
              <h3 id="backupTitle">{{BACKUP_TITLE}}</h3>
              <div id="backupPinPreserved" class="muted">{{BACKUP_PIN_PRESERVED}}</div>
              <div class="backup-actions">
                <select id="backupSelect" aria-label="{{BACKUP_TITLE}}"></select>
                <button id="restoreBackupBtn" class="smallbtn" onclick="restoreBackup()">{{BACKUP_RESTORE}}</button>
              </div>
              <div id="backupMsg" class="ui-state backup-message" aria-live="polite" hidden></div>
            </section>
          </section>
        </main>
      </div>
    </div>
  </div>
</div>
<div class="cornerbar hidden">
  <div class="smallcluster"><button id="shutdownBtn" class="smallbtn" onclick="shutdownNow()"></button><button id="profileBtn" class="smallbtn profile-button" onclick="openProfilePicker()"></button></div>
  <div class="smallcluster"><button id="exitBtn" class="smallbtn" onclick="exitKids()"></button><button id="parentBtn" class="smallbtn" onclick="handleParentClick()"></button></div>
</div>
<script defer src="/frontend/state.js"></script>
<script defer src="/frontend/localization.js"></script>
<script defer src="/frontend/icons.js"></script>
<script defer src="/frontend/dialogs.js"></script>
<script defer src="/frontend/launcher-ui.js"></script>
<script defer src="/frontend/profiles.js"></script>
<script defer src="/frontend/parent-settings.js"></script>
<script defer src="/frontend/first-run.js"></script>
<script defer src="/frontend/runtime-controls.js"></script>
</body>
</html>
