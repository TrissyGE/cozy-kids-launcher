name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python templates
        run: python -m py_compile src/server.py src/app_detection.py src/backup_store.py src/config_store.py src/config_validation.py src/lifecycle_state.py src/parent_auth.py src/runtime_diagnostics.py src/process_state.py src/process_supervisor.py src/overlay.py src/timer_watchdog.py scripts/take-screenshots.py scripts/linux/desktop_smoke.py scripts/wsl/browser_driver.py scripts/wsl/browser-e2e.py scripts/wsl/capture-page.py scripts/wsl/probe-web-targets.py

      - name: Validate JSON data
        run: |
          python -m json.tool examples/config.example.json >/dev/null
          python -m json.tool src/recommendations.json >/dev/null

      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/update.sh scripts/deploy.sh scripts/wsl/setup-test-env.sh scripts/wsl/run-gui-smoke.sh src/launcher.sh

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install browser test dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Exercise core browser journeys
        run: python scripts/wsl/browser-e2e.py

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e
          path: .test-artifacts/browser-e2e/
          if-no-files-found: warn
