name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the package twice and compare bytes
        run: |
          python3 scripts/build-deb.py .test-artifacts/deb/first
          python3 scripts/build-deb.py .test-artifacts/deb/second
          diff -qr .test-artifacts/deb/first .test-artifacts/deb/second
      - name: Inspect and install the package
        run: |
          dpkg-deb --info .test-artifacts/deb/first/*.deb
          dpkg-deb --contents .test-artifacts/deb/first/*.deb
          sudo apt-get install -y --no-install-recommends ./.test-artifacts/deb/first/*.deb
      - name: Exercise the installed runtime as an ordinary user
        run: python3 scripts/linux/package_runtime_smoke.py
      - name: Rebuild on a host with the package installed
        run: |
          python3 scripts/build-deb.py .test-artifacts/deb/installed-host
          diff -qr .test-artifacts/deb/first .test-artifacts/deb/installed-host
      - name: Remove the installed package
        if: always()
        run: sudo dpkg --purge cozy-kids-launcher
      - name: Save the reviewable package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: .test-artifacts/deb/first/

  test:
    name: Python ${{ matrix.python-version }}
    # Python 3.9 has published builds for 24.04, not the new 26.04 runner.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and API tests
        run: python scripts/check.py --only unit

      - name: Validate Python, JSON, locales, and every shell script
        run: python scripts/check.py --only static

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install browser test dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Exercise core browser journeys
        run: python scripts/check.py --only browser
      - name: Exercise RetroGameCorner and hardware explanations
        run: python scripts/wsl/browser-e2e.py --suite retro --artifacts .test-artifacts/browser-e2e/retro

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e
          path: .test-artifacts/browser-e2e/
          if-no-files-found: warn
