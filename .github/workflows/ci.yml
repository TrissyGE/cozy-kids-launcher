name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and API tests
        run: python scripts/check.py --only unit

      - name: Validate Python, JSON, locales, and every shell script
        run: python scripts/check.py --only static

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install browser test dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Exercise core browser journeys
        run: python scripts/check.py --only browser

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e
          path: .test-artifacts/browser-e2e/
          if-no-files-found: warn
