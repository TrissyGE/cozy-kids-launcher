name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: stable-release-promotion
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$version" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}-rc\.[1-9][0-9]{0,8}$ ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release version" >&2
            exit 1
          fi
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          grep -F "## [$version] - " CHANGELOG.md | grep -Eq '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Release commit must descend from the stable main branch" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure stable-main deploy key
        if: steps.version.outputs.channel == 'stable'
        shell: bash
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_DEPLOY_KEY" ]]; then
            echo "Repository secret RELEASE_DEPLOY_KEY is missing" >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          key_path="$HOME/.ssh/cozy-kids-release"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" | tr -d '\r' > "$key_path"
          chmod 0600 "$key_path"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          git config core.sshCommand "ssh -i $key_path -o IdentitiesOnly=yes"
          git ls-remote "git@github.com:$GITHUB_REPOSITORY.git" refs/heads/main >/dev/null

      - name: Run unit and integration tests
        run: python scripts/check.py --only unit

      - name: Install browser test dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Exercise core browser journeys
        run: python scripts/check.py --only browser

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-e2e
          path: .test-artifacts/browser-e2e/
          if-no-files-found: warn

      - name: Validate Python, JSON, locales, and every shell script
        run: python scripts/check.py --only static

      - name: Smoke-test an isolated installation
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          bash scripts/install.sh \
            --user "$(id -un)" \
            --home "$test_home" \
            --lang en \
            --launch-mode window \
            --skip-browser-check \
            --force
          test -x "$test_home/.local/bin/cozy-kids-launcher"
          test -x "$test_home/.local/share/cozy-kids-launcher/update.sh"
          test -f "$test_home/.local/share/cozy-kids-launcher/app_detection.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/package_provider.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/package_install.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/packagekit_backend.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/package-catalog.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/app-catalog.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/application_launcher.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/backup_store.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/config_validation.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/lifecycle_state.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media_library.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media_state.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media_resume.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/retro_saves.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/retro_device.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media_session.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/parent_auth.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/speech_feedback.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/timer_state.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/schedule_rules.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/update_manager.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media.html"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/media-library.css"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/media-library.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/theme-runtime.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/accessibility-runtime.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/feedback-runtime.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/celebration-runtime.js"
          test -f "$test_home/.local/share/cozy-kids-launcher/frontend/transition-runtime.js"
          cmp VERSION "$test_home/.local/share/cozy-kids-launcher/version"

      - name: Build release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          git version --build-options
          gzip --version
          repeat="$(mktemp -d)"
          trap 'rm -rf "$repeat"' EXIT
          bash scripts/build-release-archives.sh "$GITHUB_SHA" dist
          bash scripts/build-release-archives.sh "$GITHUB_SHA" "$repeat"
          diff -qr dist "$repeat"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/cozy-kids-launcher-*.tar.gz
            dist/cozy-kids-launcher-*.zip
            dist/SHA256SUMS

      - name: Create draft, upload assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          release_options=()
          if [[ "$RELEASE_CHANNEL" == "preview" ]]; then
            release_options=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/cozy-kids-launcher-$version.tar.gz" \
            "dist/cozy-kids-launcher-$version.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --draft "${release_options[@]}" \
            --generate-notes \
            --title "Cozy Kids Launcher $version"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          if [[ "$RELEASE_CHANNEL" == "preview" ]]; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)" == "true" ]]
          fi
        env:
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          GH_TOKEN: ${{ github.token }}

      - name: Promote the published release commit to stable main
        if: steps.version.outputs.channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          stable_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$stable_sha" "$GITHUB_SHA"; then
            echo "Refusing a non-fast-forward main update" >&2
            exit 1
          fi
          git push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/heads/main"
