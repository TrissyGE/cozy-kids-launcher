name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: stable-release-promotion
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure stable-main deploy key
        shell: bash
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_DEPLOY_KEY" ]]; then
            echo "Repository secret RELEASE_DEPLOY_KEY is missing" >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          key_path="$HOME/.ssh/cozy-kids-release"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" | tr -d '\r' > "$key_path"
          chmod 0600 "$key_path"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          git config core.sshCommand "ssh -i $key_path -o IdentitiesOnly=yes"
          git ls-remote "git@github.com:$GITHUB_REPOSITORY.git" refs/heads/main >/dev/null

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Release commit must descend from the stable main branch" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Install browser test dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Exercise core browser journeys
        run: python scripts/wsl/browser-e2e.py

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-e2e
          path: .test-artifacts/browser-e2e/
          if-no-files-found: warn

      - name: Compile Python templates
        run: python -m py_compile src/server.py src/app_detection.py src/application_launcher.py src/activity_store.py src/backup_store.py src/config_store.py src/config_validation.py src/profile_config.py src/schedule_rules.py src/lifecycle_state.py src/media_library.py src/parent_auth.py src/runtime_diagnostics.py src/process_state.py src/process_supervisor.py src/overlay.py src/timer_state.py src/timer_watchdog.py src/update_manager.py scripts/generate-locales.py scripts/take-screenshots.py scripts/linux/desktop_smoke.py scripts/wsl/browser_driver.py scripts/wsl/browser-e2e.py scripts/wsl/capture-page.py scripts/wsl/probe-web-targets.py

      - name: Validate data and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool examples/config.example.json >/dev/null
          python -m json.tool src/recommendations.json >/dev/null
          python -m json.tool src/frontend/locales/de.json >/dev/null
          python -m json.tool src/frontend/locales/en.json >/dev/null
          python scripts/generate-locales.py --check
          bash -n scripts/install.sh scripts/update.sh scripts/deploy.sh scripts/wsl/setup-test-env.sh scripts/wsl/run-gui-smoke.sh src/launcher.sh

      - name: Smoke-test an isolated installation
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          bash scripts/install.sh \
            --user "$(id -un)" \
            --home "$test_home" \
            --lang en \
            --launch-mode window \
            --skip-browser-check \
            --force
          test -x "$test_home/.local/bin/cozy-kids-launcher"
          test -x "$test_home/.local/share/cozy-kids-launcher/update.sh"
          test -f "$test_home/.local/share/cozy-kids-launcher/app_detection.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/application_launcher.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/backup_store.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/config_validation.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/lifecycle_state.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/media_library.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/parent_auth.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/timer_state.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/schedule_rules.py"
          test -f "$test_home/.local/share/cozy-kids-launcher/update_manager.py"
          cmp VERSION "$test_home/.local/share/cozy-kids-launcher/version"

      - name: Build release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          prefix="cozy-kids-launcher-$version/"
          mkdir -p dist
          git archive --format=tar --prefix="$prefix" "$GITHUB_SHA" \
            | gzip -n > "dist/cozy-kids-launcher-$version.tar.gz"
          git archive --format=zip --prefix="$prefix" \
            --output="dist/cozy-kids-launcher-$version.zip" "$GITHUB_SHA"
          (
            cd dist
            sha256sum \
              "cozy-kids-launcher-$version.tar.gz" \
              "cozy-kids-launcher-$version.zip" \
              > SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/cozy-kids-launcher-*.tar.gz
            dist/cozy-kids-launcher-*.zip
            dist/SHA256SUMS

      - name: Create draft, upload assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/cozy-kids-launcher-$version.tar.gz" \
            "dist/cozy-kids-launcher-$version.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Cozy Kids Launcher $version"
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Promote the published release commit to stable main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          stable_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$stable_sha" "$GITHUB_SHA"; then
            echo "Refusing a non-fast-forward main update" >&2
            exit 1
          fi
          git push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/heads/main"
